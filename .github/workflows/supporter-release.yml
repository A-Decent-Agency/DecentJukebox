name: Prepare Supporter DNFT
# Immutable DecentHead product kit; keep uses and head_ref identical.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag to prepare
        required: true
permissions:
  contents: write
  issues: write
concurrency:
  group: supporter-${{ github.repository }}
  cancel-in-progress: false
jobs:
  prepare:
    uses: TheJollyLaMa/DecentHead/.github/workflows/product-supporter-prepare.yml@a0f3bdebcbb5ded8437446797fcba28272af8098
    with:
      tag: ${{ inputs.tag || github.event.release.tag_name }}
      head_ref: a0f3bdebcbb5ded8437446797fcba28272af8098
      product_name: DJuke
      quantity: '100'
      tagline: Cloneable USDC jukebox supporting artists and shared playback infrastructure.
      ens_name: ${{ vars.SUPPORTER_ENS_NAME }}
    secrets:
      PINATA_JWT: ${{ secrets.PINATA_JWT }}
